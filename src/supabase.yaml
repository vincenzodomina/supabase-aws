              awslogs-stream-prefix: storage-tls
              mode: non-blocking
              max-buffer-size: 10m
          Services:
            - PortName: storage
              DiscoveryName: storage-tls
              ClientAliases:
                - DnsName: !Sub 'storage.${AWS::StackName}.internal'
                  Port: 5000
              Timeout:
                IdleTimeoutSeconds: 0
                PerRequestTimeoutSeconds: 0
              Tls:
                IssuerCertificateAuthority:
                  AwsPcaAuthorityArn: !Ref 'ServiceConnectPrivateCaArn'
                RoleArn: !GetAtt 'ServiceConnectRole.Arn'
                KmsKey: !If [HasServiceConnectKmsKey, !Ref 'ServiceConnectKmsKeyArn', !Ref 'AWS::NoValue']
        - Enabled: false
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      AvailabilityZoneRebalancing: ENABLED
      EnableECSManagedTags: true
    DependsOn:
      - EncryptionCheck
      - Bootstrap
      - AuthService
      - RestService
  StorageScaling:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: !Ref 'StorageMinTasks'
      MaxCapacity: !Ref 'StorageMaxTasks'
      ResourceId: !Join
        - /
        - - service
          - !Ref 'Cluster'
          - !GetAtt 'StorageService.Name'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  StorageScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: StorageCpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref 'StorageScaling'
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
  ApiAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # Rules require public subnet IDs only for internet-facing access.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      Scheme: !Ref 'ApiExposure'
      Type: application
      Subnets: !If [PublicApi, !Ref 'PublicSubnetIds', !Ref 'PrivateSubnetIds']
      SecurityGroups:
        - !Ref 'ApiAlbSG'
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: routing.http.desync_mitigation_mode
          Value: strictest
        - Key: idle_timeout.timeout_seconds
          Value: '120'
  GatewayTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref 'VpcId'
      TargetType: ip
      Port: 8000
      Protocol: !If [UseServiceConnectTls, HTTPS, HTTP]
      HealthCheckProtocol: !If [UseServiceConnectTls, HTTPS, HTTP]
      HealthCheckPort: traffic-port
      HealthCheckPath: /healthz
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref 'ApiAlb'
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref 'CertificateArn'
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - !If
          - ForwardApi
          - Type: forward
            TargetGroupArn: !Ref 'GatewayTargets'
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: '503'
              ContentType: text/plain
              MessageBody: Service temporarily unavailable
  ApiDns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref 'HostedZoneId'
      Name: !Ref 'ApiDomainName'
      Type: A
      AliasTarget:
        DNSName: !GetAtt 'ApiAlb.DNSName'
        HostedZoneId: !GetAtt 'ApiAlb.CanonicalHostedZoneID'
    Condition: CreateDns
  PrivateApiAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: AdditionalPrivateApi
    Properties:
      Scheme: internal
      Type: application
      Subnets: !Ref PrivateSubnetIds
      SecurityGroups:
        - !Ref 'PrivateApiAlbSG'
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: routing.http.desync_mitigation_mode
          Value: strictest
        - Key: idle_timeout.timeout_seconds
          Value: '120'
  PrivateGatewayTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: AdditionalPrivateApi
    Properties:
      VpcId: !Ref 'VpcId'
      TargetType: ip
      Port: 8000
      Protocol: !If [UseServiceConnectTls, HTTPS, HTTP]
      HealthCheckProtocol: !If [UseServiceConnectTls, HTTPS, HTTP]
      HealthCheckPort: traffic-port
      HealthCheckPath: /healthz
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
  PrivateApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: AdditionalPrivateApi
    Properties:
      LoadBalancerArn: !Ref 'PrivateApiAlb'
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref 'CertificateArn'
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref 'PrivateGatewayTargets'
  PrivateApiDns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateHostedZoneId
      Name: !Ref 'ApiDomainName'
      Type: A
      AliasTarget:
        DNSName: !GetAtt 'PrivateApiAlb.DNSName'
        HostedZoneId: !GetAtt 'PrivateApiAlb.CanonicalHostedZoneID'
    Condition: CreatePrivateApiDns
  AdminTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: !If [UseServiceConnectTls, '2048', '1024']
      Memory: !If [UseServiceConnectTls, '4096', '2048']
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: !Ref 'EcsCpuArchitecture'
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt 'AdminExecutionRole.Arn'
      TaskRoleArn: !GetAtt 'CertificatesRole.Arn'
      Volumes:
        - Name: certificates
      ContainerDefinitions:
        - Name: certificates
          Image: public.ecr.aws/aws-cli/aws-cli:2.36.14@sha256:72180b996fad939e764434d9a69a9512ed699a061cd5db198feeb2e9533fd750
          Essential: false
          Command:
            - s3
            - cp
            - !Sub 's3://${ArtifactsBucket}/${CertificateKey}'
            - /shared/rds-ca.pem
            - --only-show-errors
          MountPoints:
            - SourceVolume: certificates
              ContainerPath: /shared
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'LogGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: certificates
              mode: non-blocking
              max-buffer-size: 10m
        - Name: meta
          Image: supabase/postgres-meta:v0.100.0@sha256:145325b7e39f8ef4931d6e8cfd3f6f4d655de09d72a2ccc96d9513542c2202bd
          Essential: true
          Memory: 1024
          Environment:
            - Name: PG_META_PORT
              Value: '8080'
            - Name: PG_META_DB_HOST
              Value: !GetAtt 'Database.Endpoint.Address'
            - Name: PG_META_DB_PORT
              Value: '5432'
            - Name: PG_META_DB_NAME
              Value: postgres
            - Name: PG_META_DB_USER
              Value: postgres
            - Name: PG_META_DB_SSL_MODE
              Value: verify-full
            - Name: NODE_EXTRA_CA_CERTS
              Value: /certs/rds-ca.pem
            - Name: NODE_OPTIONS
              Value: --max-old-space-size=600
          Secrets:
            - Name: PG_META_DB_PASSWORD
              ValueFrom: !Sub
                - '${SecretArn}:password::'
                - SecretArn: !If [UseExistingDatabaseSecret, !Ref ExistingDatabaseSecretArn, !Ref DatabaseSecret]
            - Name: CRYPTO_KEY
              ValueFrom: !Sub '${MetaSecret}:crypto_key::'
          MountPoints:
            - SourceVolume: certificates
              ContainerPath: /certs
              ReadOnly: true
          DependsOn:
            - ContainerName: certificates
              Condition: SUCCESS
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'LogGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: meta
              mode: non-blocking
              max-buffer-size: 10m
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 60
        - Name: studio
          Image: supabase/studio:2026.10.12-sha-3699278@sha256:948770ec467f00e6ae34c35018ef7cb23d7b30eb806b42c2cc0d7bcfdcf8a7a8
          Essential: true
          PortMappings:
            - Name: studio
              AppProtocol: http
              ContainerPort: 3000
          DependsOn:
            - ContainerName: meta
              Condition: HEALTHY
          Environment:
            - Name: HOSTNAME
              Value: 0.0.0.0
            - Name: STUDIO_PG_META_URL
              Value: http://localhost:8080
            - Name: POSTGRES_HOST
              Value: !GetAtt 'Database.Endpoint.Address'
            - Name: POSTGRES_PORT
              Value: '5432'
            - Name: POSTGRES_DB
              Value: postgres
            - Name: POSTGRES_USER_READ_WRITE
              Value: postgres
            - Name: SUPABASE_URL
              Value: !Sub 'http://gateway.${AWS::StackName}.internal:8000'
            - Name: SUPABASE_PUBLIC_URL
              Value: !Sub 'https://${ApiDomainName}'
            - Name: DEFAULT_ORGANIZATION_NAME
              Value: Self-hosted
            - Name: DEFAULT_PROJECT_NAME
              Value: !Ref 'AWS::StackName'
            - Name: PGRST_DB_SCHEMAS
              Value: !Ref 'ApiSchemas'
            - Name: ENABLED_FEATURES_LOGS_ALL
              Value: 'false'
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub
                - '${SecretArn}:password::'
                - SecretArn: !If [UseExistingDatabaseSecret, !Ref ExistingDatabaseSecretArn, !Ref DatabaseSecret]
            - Name: PG_META_CRYPTO_KEY
              ValueFrom: !Sub '${MetaSecret}:crypto_key::'
            - Name: AUTH_JWT_SECRET
              ValueFrom: !Sub '${ApiSecret}:JWT_SECRET::'
            - Name: SUPABASE_ANON_KEY
              ValueFrom: !Sub '${ApiSecret}:ANON_KEY::'
            - Name: SUPABASE_SERVICE_KEY
              ValueFrom: !Sub '${ApiSecret}:SERVICE_ROLE_KEY::'
            - Name: SUPABASE_PUBLISHABLE_KEY
              ValueFrom: !Sub '${ApiSecret}:SUPABASE_PUBLISHABLE_KEY::'
            - Name: SUPABASE_SECRET_KEY
              ValueFrom: !Sub '${ApiSecret}:SUPABASE_SECRET_KEY::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'LogGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: studio
              mode: non-blocking
              max-buffer-size: 10m
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://localhost:3000/api/platform/profile').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 60
    Condition: RunStudio
  AdminAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      Subnets: !Ref 'PrivateSubnetIds'
      SecurityGroups:
        - !Ref 'AdminAlbSG'
    Condition: RunStudio
  AdminTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref 'VpcId'
      TargetType: ip
      Port: 3000
      Protocol: !If [UseServiceConnectTls, HTTPS, HTTP]
      HealthCheckProtocol: !If [UseServiceConnectTls, HTTPS, HTTP]
      HealthCheckPort: traffic-port
      HealthCheckPath: /api/platform/profile
      Matcher:
        HttpCode: '200'
    Condition: RunStudio
  AdminListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref 'AdminAlb'
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref 'CertificateArn'
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref 'AdminTargets'
    Condition: RunStudio
  AdminService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref 'Cluster'
      TaskDefinition: !Ref 'AdminTask'
      DesiredCount: 1
      LaunchType: FARGATE
      ForceNewDeployment:
        EnableForceNewDeployment: true
        ForceNewDeploymentNonce: !Ref 'CredentialRevision'
      PlatformVersion: 1.4.0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref 'PrivateSubnetIds'
          SecurityGroups:
            - !Ref 'AdminSG'
      HealthCheckGracePeriodSeconds: 120
      LoadBalancers:
        - ContainerName: studio
          ContainerPort: 3000
          TargetGroupArn: !Ref 'AdminTargets'
      ServiceConnectConfiguration: !If
        - UseServiceConnectTls
        - Enabled: true
          Namespace: !GetAtt 'TlsNamespace.Arn'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'LogGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: studio-tls
              mode: non-blocking
              max-buffer-size: 10m
          Services:
            - PortName: studio
              DiscoveryName: studio-tls
              ClientAliases:
                - DnsName: !Sub 'studio.${AWS::StackName}.internal'
                  Port: 3000
              Timeout:
                IdleTimeoutSeconds: 0
                PerRequestTimeoutSeconds: 0
              Tls:
                IssuerCertificateAuthority:
                  AwsPcaAuthorityArn: !Ref 'ServiceConnectPrivateCaArn'
                RoleArn: !GetAtt 'ServiceConnectRole.Arn'
                KmsKey: !If [HasServiceConnectKmsKey, !Ref 'ServiceConnectKmsKeyArn', !Ref 'AWS::NoValue']
        - Enabled: false
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
    DependsOn:
      - EncryptionCheck
      - Bootstrap
      - GatewayService
      - AdminListener
    Condition: RunStudio
  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Investigate FreeStorageSpace
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref 'Database'
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5368709120
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref 'AlarmTopicArn'
        - !Ref 'AWS::NoValue'
  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Investigate CPUUtilization
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref 'Database'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref 'AlarmTopicArn'
        - !Ref 'AWS::NoValue'
  DatabaseConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MonitorDatabaseConnections
    Properties:
      AlarmDescription: RDS connections reached the operator's capacity warning threshold; inspect pools, deployment overlap, and external clients.
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref 'Database'
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref 'DatabaseConnectionAlarmThreshold'
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref 'AlarmTopicArn'
        - !Ref 'AWS::NoValue'
  DatabaseMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MonitorDatabaseMemory
    Properties:
      AlarmDescription: RDS freeable memory fell below the operator's measured floor; inspect workload and connection pressure before increasing capacity.
      Namespace: AWS/RDS
      MetricName: FreeableMemory
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref 'Database'
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref 'DatabaseFreeableMemoryAlarmBytes'
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref 'AlarmTopicArn'
        - !Ref 'AWS::NoValue'
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Investigate HTTPCode_Target_5XX_Count
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt 'ApiAlb.LoadBalancerFullName'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref 'AlarmTopicArn'
        - !Ref 'AWS::NoValue'
  PrivateApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AdditionalPrivateApi
    Properties:
      AlarmDescription: Investigate HTTPCode_Target_5XX_Count
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt 'PrivateApiAlb.LoadBalancerFullName'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref 'AlarmTopicArn'
        - !Ref 'AWS::NoValue'
Outputs:
  PrivateApiUrl:
    Condition: HasPrivateApi
    Value: !Sub 'https://${ApiDomainName}'
  PrivateApiLoadBalancerDnsName:
    Condition: HasPrivateApi
    Value: !If [AdditionalPrivateApi, !GetAtt PrivateApiAlb.DNSName, !GetAtt ApiAlb.DNSName]
  PrivateApiSecurityGroupId:
    Condition: HasPrivateApi
    Value: !If [AdditionalPrivateApi, !Ref PrivateApiAlbSG, !Ref ApiAlbSG]
  ApiUrl:
    Value: !Sub 'https://${ApiDomainName}'
  ApiLoadBalancerDnsName:
    Value: !GetAtt 'ApiAlb.DNSName'
  ApiSecurityGroupId:
    Value: !Ref 'ApiAlbSG'
  GatewaySecurityGroupId:
    Value: !Ref 'GatewaySG'
  DatabaseEndpoint:
    Value: !GetAtt 'Database.Endpoint.Address'
  DatabasePort:
    Value: !GetAtt 'Database.Endpoint.Port'
  DatabaseSecurityGroupId:
    Value: !Ref 'DatabaseSG'
  DatabaseSecretArn:
    Value: !If [UseExistingDatabaseSecret, !Ref ExistingDatabaseSecretArn, !Ref DatabaseSecret]
  ApiSecretArn:
    Value: !Ref 'ApiSecret'
  StorageBucketName:
    Value: !Ref 'Bucket'
  ClusterName:
    Value: !Ref 'Cluster'
  ServiceConnectNamespaceArn:
    Value: !GetAtt 'TlsNamespace.Arn'
    Condition: UseServiceConnectTls
  LogGroupName:
    Value: !Ref 'LogGroup'
  StudioUrl:
    Value: !Sub 'https://${StudioDomainName}'
    Condition: RunStudio
  StudioLoadBalancerDnsName:
    Value: !GetAtt 'AdminAlb.DNSName'
    Condition: RunStudio
Rules:
  ServiceConnectRequiresPrivateCa:
    RuleCondition: !Equals [!Ref 'InternalTrafficEncryption', service-connect-tls]
    Assertions:
      - Assert: !Not [!Equals [!Ref 'ServiceConnectPrivateCaArn', '']]
        AssertDescription: Provide an existing tagged AWS Private CA for Service Connect TLS.
  PrivateApiRequiresClients:
    RuleCondition: !And
      - !Or [!Equals [!Ref ApiExposure, internal], !Equals [!Ref EnablePrivateApi, 'true']]
      - !Equals [!Ref 'ManageApiIngress', 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref 'ApiClientSecurityGroupId', '']]
        AssertDescription: Provide ApiClientSecurityGroupId or explicitly set ManageApiIngress=false and manage private ingress in the consuming infrastructure.
  PublicApiRequiresSubnets:
    RuleCondition: !Equals [!Ref 'ApiExposure', internet-facing]
    Assertions:
      - Assert: !Not
          - Fn::Contains: [!Ref 'PublicSubnetIds', '']
        AssertDescription: Provide public subnets in two Availability Zones for internet-facing API access.
  StudioRequiresHostname:
    RuleCondition: !Equals
      - !Ref 'EnableStudio'
      - 'true'
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref 'StudioDomainName'
            - ''
        AssertDescription: Provide StudioDomainName covered by CertificateArn when enabling Studio.
  SmtpRequiresCredentials:
    RuleCondition: !Equals [!Ref EmailMode, smtp]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref SesSmtpSecretArn, '']]
          - !Not [!Equals [!Ref SesSenderEmail, '']]
        AssertDescription: Provide SesSmtpSecretArn and SesSenderEmail for SMTP email.
  EmailHookRequiresEndpoint:
    RuleCondition: !Equals [!Ref EmailMode, hook]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref EmailHookUri, '']]
          - !Not [!Equals [!Ref EmailHookSecretArn, '']]
        AssertDescription: Provide EmailHookUri and EmailHookSecretArn for hook email.
  AdditionalPrivateApiRequiresPublicApi:
    RuleCondition: !Equals [!Ref EnablePrivateApi, 'true']
    Assertions:
      - Assert: !Equals [!Ref ApiExposure, internet-facing]
        AssertDescription: EnablePrivateApi adds an endpoint to a public API; internal APIs already provide private access.
  PrivateDnsRequiresAdditionalApi:
    RuleCondition: !Not [!Equals [!Ref PrivateHostedZoneId, '']]
    Assertions:
      - Assert: !And
          - !Equals [!Ref EnablePrivateApi, 'true']
          - !Equals [!Ref ApiExposure, internet-facing]
          - !Not [!Equals [!Ref PrivateHostedZoneId, !Ref HostedZoneId]]
        AssertDescription: Use a separate private zone with the additional API; internal-only APIs use HostedZoneId.
