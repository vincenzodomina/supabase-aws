      FromPort: 5432
      ToPort: 5432
  StorageDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref 'DatabaseSG'
      SourceSecurityGroupId: !Ref 'StorageSG'
