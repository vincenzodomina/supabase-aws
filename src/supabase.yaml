AWSTemplateFormatVersion: '2010-09-09'
Description: Supabase on ECS Fargate with RDS PostgreSQL and S3; existing network and email delivery required.
Parameters:
  ExistingDatabaseSecretArn:
    Type: String
    Default: ''
    Description: Existing same-account/region secret with username postgres and password; empty creates an administrator secret.
  ExistingDatabaseSecretKmsKeyArn:
    Type: String
    Default: ''
    Description: Optional customer-managed KMS key protecting ExistingDatabaseSecretArn.
  LegacyApiKeysSecretArn:
    Type: String
    Default: ''
    Description: Optional read-only secret with JWT_SECRET, ANON_KEY and SERVICE_ROLE_KEY for initial credential adoption.
  LegacyApiKeysKmsKeyArn:
    Type: String
    Default: ''
    Description: Optional customer-managed KMS key protecting LegacyApiKeysSecretArn.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC with DNS support and hostnames enabled.
  InternalTrafficEncryption:
    Type: String
    Description: Require existing VPC encryption enforcement or use managed Service Connect TLS; see docs/Networking.md before changing modes.
    AllowedValues: [vpc, service-connect-tls]
    Default: vpc
  ServiceConnectPrivateCaArn:
    Type: String
    Description: Existing same-region AWS Private CA tagged AmazonECSManaged=true; required for service-connect-tls. Short-lived mode is recommended.
    Default: ''
    AllowedPattern: '(^$|arn:[^:]+:acm-pca:[^:]+:[0-9]{12}:certificate-authority/[a-zA-Z0-9-]+)'
  ServiceConnectKmsKeyArn:
    Type: String
    Description: Optional existing symmetric KMS key for Service Connect TLS secrets; empty uses the AWS-owned key. Its policy must permit ServiceConnectRole.
    Default: ''
    AllowedPattern: '(^$|arn:[^:]+:kms:[^:]+:[0-9]{12}:key/[a-zA-Z0-9-]+)'
  EcsCpuArchitecture:
    Type: String
    Description: Architecture for all ECS containers. ARM64 requires supported Fargate AZs; see docs/Compute.md. Lambda packaging is unchanged.
    AllowedValues: [X86_64, ARM64]
    Default: X86_64
  PublicSubnetIds:
    Type: CommaDelimitedList
    Description: Two public subnets in distinct AZs; required only for internet-facing API access.
    Default: ''
    AllowedPattern: '(^$|subnet-([0-9a-f]{8}|[0-9a-f]{17}))'
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two private subnets in distinct AZs with outbound HTTPS/SES SMTP access.
  DatabaseSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing private database subnets in at least two AZs.
  CertificateArn:
    Type: String
    Description: Existing ACM certificate covering API and optional Studio names, in this region.
    AllowedPattern: arn:[^:]+:acm:[^:]+:[0-9]{12}:certificate/.+
  ApiDomainName:
    Type: String
    Description: API DNS hostname; point it at ApiLoadBalancerDnsName.
    AllowedPattern: '[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'
  ApiExposure:
    Type: String
    Description: Internal API for private clients, or explicitly internet-facing. Changing this replaces the API load balancer.
    AllowedValues:
      - internal
      - internet-facing
    Default: internal
  PublicApiEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set false to return HTTP 503 from an internet-facing API. Private API access is unaffected.
  EnablePrivateApi:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Add an internal HTTPS ALB alongside an internet-facing API; adds an ALB charge.
  PrivateHostedZoneId:
    Type: String
    Default: ''
    Description: Existing VPC-associated private hosted zone for the additional API alias; empty means manage its DNS yourself.
  ApiClientSecurityGroupId:
    Type: String
    Description: Existing client security group allowed HTTPS access to the internal API when ManageApiIngress=true.
    Default: ''
    AllowedPattern: '(^$|sg-([0-9a-f]{8}|[0-9a-f]{17}))'
  ManageApiIngress:
    Type: String
    Description: For private API access, create the client HTTPS rule. Set false only when consuming infrastructure owns ingress to PrivateApiSecurityGroupId.
    AllowedValues: ['true', 'false']
    Default: 'true'
  HostedZoneId:
    Type: String
    Description: Existing Route 53 zone; use a VPC-associated private zone for internal access. Empty means manage DNS yourself.
    Default: ''
  SiteUrl:
    Type: String
    Description: Application URL used in Auth email links.
    AllowedPattern: https://[^\s]+
  AdditionalRedirectUrls:
    Type: String
    Description: Comma-separated Auth redirect allow list.
    Default: ''
  EmailMode:
    Type: String
    AllowedValues: [smtp, hook]
    Default: smtp
    Description: SES SMTP by default, or an existing HTTPS send-email hook.
  EmailHookUri:
    Type: String
    Default: ''
    AllowedPattern: '(^$|https://[^\s]+)'
    Description: Existing HTTPS send-email hook endpoint; required in hook mode.
  EmailHookSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '(^$|arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+)'
    Description: Existing Secrets Manager JSON with a secret field containing the Auth hook signing secret.
  EmailHookKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '(^$|arn:[^:]+:kms:[^:]+:[0-9]{12}:key/[a-zA-Z0-9-]+)'
    Description: Optional customer-managed key for the hook secret; its policy must permit AuthExecutionRole.
  EnablePhoneSignup:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enable phone authentication. SMS delivery is not provisioned by this stack.
  EnablePhoneAutoconfirm:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Confirm phone numbers without SMS verification; enable only deliberately.
  EnableEmailAutoconfirm:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Confirm email addresses without verification; enable only deliberately.
  SesRegion:
    Type: String
    Description: Region containing the verified SES identity and SMTP credentials.
    Default: us-east-1
  SesSenderEmail:
    Type: String
    Description: Verified SES sender email address; required in SMTP mode.
    Default: ''
    AllowedPattern: '(^$|[^\s@]+@[^\s@]+)'
  SesSmtpSecretArn:
    Type: String
    Description: Existing Secrets Manager JSON secret with username and password (SES SMTP credentials).
    Default: ''
    AllowedPattern: '(^$|arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+)'
  SesSmtpKmsKeyArn:
    Type: String
    Description: Existing customer-managed KMS key for the SMTP secret; empty for the AWS-managed key. Its key policy must permit AuthExecutionRole.
    Default: ''
    AllowedPattern: '(^$|arn:[^:]+:kms:[^:]+:[0-9]{12}:key/[a-zA-Z0-9-]+)'
  EnableStudio:
    Type: String
    Description: Create Studio and postgres-meta together, behind an internal HTTPS ALB.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  StudioDomainName:
    Type: String
    Description: DNS name for optional Studio; resolve to the internal ALB.
    Default: ''
  StudioClientCidr:
    Type: String
    Description: Private/VPN client IPv4 CIDR permitted to reach Studio.
    AllowedPattern: (10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)[0-9./]+
    Default: 10.0.0.0/8
  ArtifactsBucket:
    Type: String
    Description: Existing private artifact bucket in this region; supplied by deploy.sh.
  BootstrapKey:
    Type: String
    Description: Content-addressed Lambda ZIP object key; supplied by deploy.sh.
  CredentialRevision:
    Type: String
    Description: Non-secret change identifier; change deliberately to reapply credentials and roll all services. See docs/Credentials.md.
    Default: initial
    AllowedPattern: '[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}'
  CertificateKey:
    Type: String
    Description: Content-addressed RDS CA bundle object key; supplied by deploy.sh.
  DatabaseEngineVersion:
    Type: String
    Description: RDS PostgreSQL 17 minor version available in the target region.
    AllowedPattern: 17\.[0-9]+
    Default: '17.6'
  DatabaseInstanceClass:
    Type: String
    Description: RDS instance size; tune together with service connection limits.
    Default: db.t4g.medium
  DatabaseQueryStatistics:
    Type: String
    Description: Optional administrator-only query statistics; top collects top-level statements, none stops collection. See docs/Compute.md.
    AllowedValues: [none, top]
    Default: none
  DatabaseMultiAZ:
    Type: String
    Description: Enable RDS standby in another Availability Zone.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
  DatabaseDeletionProtection:
    Type: String
    Description: Disable explicitly before deleting the stack.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
  DatabaseAllocatedStorage:
    Type: Number
    Description: Initial RDS gp3 storage in GiB.
    MinValue: 20
    Default: 20
  DatabaseMaxAllocatedStorage:
    Type: Number
    Description: Maximum autoscaled RDS storage in GiB.
    MinValue: 20
    Default: 100
  DatabaseBackupRetentionDays:
    Type: Number
    Description: RDS automated backup retention.
    MinValue: 1
    MaxValue: 35
    Default: 14
  LogRetentionDays:
    Type: Number
    Description: CloudWatch log retention.
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90
      - 180
      - 365
    Default: 30
  ServiceLogRetentionDays:
    Type: Number
    Description: Retention for RDS exports and Container Insights logs. Zero leaves policies unchanged. Shortening retention deletes history; see docs/Retention.md.
    Default: 0
    AllowedValues: [0, 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
  ContainerInsights:
    Type: String
    Description: Optional paid ECS task telemetry; service metrics and application logs remain available when disabled.
    AllowedValues:
      - enabled
      - disabled
    Default: enabled
  FileSizeLimitBytes:
    Type: Number
    Description: Maximum Storage upload size.
    MinValue: 1
    Default: 52428800
  StorageNoncurrentVersionRetentionDays:
    Type: Number
    Description: Permanently expire noncurrent S3 versions after this many days. Zero disables expiry. Review recovery/erasure policy in docs/Retention.md first.
    Default: 0
    MinValue: 0
  StorageTenantId:
    Type: String
    Description: Stable Storage object-key prefix. Empty uses the stack name. Preserve the existing value when adopting stored objects; changing it does not move files.
    Default: ''
    AllowedPattern: '(^$|[a-zA-Z0-9][a-zA-Z0-9._-]{0,127})'
  DisableSignup:
    Type: String
    Description: Require invitations/admin-created users.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
  ApiSchemas:
    Type: String
    Description: Explicit PostgREST schema allow list. New tables need grants and RLS.
    Default: public
  GatewayMinTasks:
    Type: Number
    Description: Minimum Gateway replicas; production default spans two AZs.
    MinValue: 1
    MaxValue: 4
    Default: 2
  GatewayMaxTasks:
    Type: Number
    Description: Maximum Gateway replicas; bound by database connection capacity.
    MinValue: 1
    MaxValue: 20
    Default: 4
  GatewayCpu:
    Type: String
    Description: Gateway Fargate CPU units; Service Connect TLS raises 256 to 512 for proxy headroom.
    AllowedValues:
      - '256'
      - '512'
      - '1024'
      - '2048'
    Default: '256'
  GatewayMemory:
    Type: String
    Description: Gateway Fargate memory MiB; Service Connect TLS applies a 1024 MiB floor to baseline values. Larger values must include proxy headroom.
    Default: '512'
  AuthMinTasks:
    Type: Number
    Description: Minimum Auth replicas; production default spans two AZs.
    MinValue: 1
    MaxValue: 4
    Default: 2
  AuthMaxTasks:
    Type: Number
    Description: Maximum Auth replicas; bound by database connection capacity.
    MinValue: 1
    MaxValue: 20
    Default: 4
  AuthCpu:
    Type: String
    Description: Auth Fargate CPU units; Service Connect TLS raises 256 to 512 for proxy headroom.
    AllowedValues:
      - '256'
      - '512'
      - '1024'
      - '2048'
    Default: '256'
  AuthMemory:
    Type: String
    Description: Auth Fargate memory MiB; Service Connect TLS applies a 1024 MiB floor to baseline values. Larger values must include proxy headroom.
    Default: '512'
  RestMinTasks:
    Type: Number
    Description: Minimum Rest replicas; production default spans two AZs.
    MinValue: 1
    MaxValue: 4
    Default: 2
  RestMaxTasks:
    Type: Number
    Description: Maximum Rest replicas; bound by database connection capacity.
    MinValue: 1
    MaxValue: 20
    Default: 4
  RestCpu:
    Type: String
    Description: Rest Fargate CPU units; Service Connect TLS raises 256 to 512 for proxy headroom.
    AllowedValues:
      - '256'
      - '512'
      - '1024'
      - '2048'
    Default: '256'
  RestMemory:
    Type: String
    Description: Rest Fargate memory MiB; Service Connect TLS applies a 1024 MiB floor to baseline values. Larger values must include proxy headroom.
    Default: '512'
  StorageMinTasks:
    Type: Number
    Description: Minimum Storage replicas; production default spans two AZs.
    MinValue: 1
    MaxValue: 4
    Default: 2
  StorageMaxTasks:
    Type: Number
    Description: Maximum Storage replicas; bound by database connection capacity.
    MinValue: 1
    MaxValue: 20
    Default: 4
  StorageCpu:
    Type: String
    Description: Storage Fargate CPU units; Service Connect TLS raises 256 to 512 for proxy headroom.
    AllowedValues:
      - '256'
      - '512'
      - '1024'
      - '2048'
    Default: '256'
  StorageMemory:
    Type: String
    Description: Storage Fargate memory MiB; Service Connect TLS applies a 2048 MiB floor to baseline values. Larger values must include proxy headroom.
    Default: '1024'
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional existing SNS topic ARN for operational alarms.
  DatabaseConnectionAlarmThreshold:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Alert at this measured connection count, below usable RDS capacity. Zero omits the alarm for externally managed monitoring.
  DatabaseFreeableMemoryAlarmBytes:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Alert below this measured free-memory floor in bytes. Zero omits the alarm for externally managed monitoring.
Conditions:
  UseExistingDatabaseSecret: !Not [!Equals [!Ref ExistingDatabaseSecretArn, '']]
  CreateDatabaseSecret: !Equals [!Ref ExistingDatabaseSecretArn, '']
  HasDatabaseSecretKmsKey: !And [!Condition UseExistingDatabaseSecret, !Not [!Equals [!Ref ExistingDatabaseSecretKmsKeyArn, '']]]
  HasLegacyApiKeys: !Not [!Equals [!Ref LegacyApiKeysSecretArn, '']]
  HasLegacyApiKeysKmsKey: !And [!Condition HasLegacyApiKeys, !Not [!Equals [!Ref LegacyApiKeysKmsKeyArn, '']]]
  AdditionalPrivateApi: !And [!Condition PublicApi, !Equals [!Ref EnablePrivateApi, 'true']]
  HasPrivateApi: !Or [!Not [!Condition PublicApi], !Condition AdditionalPrivateApi]
  CreatePrivateApiDns: !And [!Condition AdditionalPrivateApi, !Not [!Equals [!Ref PrivateHostedZoneId, '']]]
  UseSmtp: !Equals [!Ref EmailMode, smtp]
  UseEmailHook: !Equals [!Ref EmailMode, hook]
  HasSesSmtpSecret: !And [!Condition UseSmtp, !Not [!Equals [!Ref SesSmtpSecretArn, '']]]
  HasEmailHookSecret: !And [!Condition UseEmailHook, !Not [!Equals [!Ref EmailHookSecretArn, '']]]
  HasEmailHookKmsKey: !And [!Condition UseEmailHook, !Not [!Equals [!Ref EmailHookKmsKeyArn, '']]]
  GatewayTlsCpuFloor: !And [!Condition UseServiceConnectTls, !Equals [!Ref 'GatewayCpu', '256']]
  GatewayTlsMemoryFloor: !And [!Condition UseServiceConnectTls, !Equals [!Ref 'GatewayMemory', '512']]
  AuthTlsCpuFloor: !And [!Condition UseServiceConnectTls, !Equals [!Ref 'AuthCpu', '256']]
  AuthTlsMemoryFloor: !And [!Condition UseServiceConnectTls, !Equals [!Ref 'AuthMemory', '512']]
  RestTlsCpuFloor: !And [!Condition UseServiceConnectTls, !Equals [!Ref 'RestCpu', '256']]
  RestTlsMemoryFloor: !And [!Condition UseServiceConnectTls, !Equals [!Ref 'RestMemory', '512']]
  StorageTlsCpuFloor: !And [!Condition UseServiceConnectTls, !Equals [!Ref 'StorageCpu', '256']]
  StorageTlsMemoryFloor: !And
    - !Condition UseServiceConnectTls
    - !Or [!Equals [!Ref 'StorageMemory', '512'], !Equals [!Ref 'StorageMemory', '1024']]
  UseVpcEncryption: !Equals [!Ref 'InternalTrafficEncryption', vpc]
  UseServiceConnectTls: !Equals [!Ref 'InternalTrafficEncryption', service-connect-tls]
  HasServiceConnectKmsKey: !And
    - !Equals [!Ref 'InternalTrafficEncryption', service-connect-tls]
    - !Not [!Equals [!Ref 'ServiceConnectKmsKeyArn', '']]
  ExpireStorageHistory: !Not [!Equals [!Ref 'StorageNoncurrentVersionRetentionDays', 0]]
  HasStorageTenantId: !Not [!Equals [!Ref 'StorageTenantId', '']]
  ManageServiceLogRetention: !Not [!Equals [!Ref 'ServiceLogRetentionDays', 0]]
  CollectContainerInsights: !Equals [!Ref 'ContainerInsights', enabled]
  MonitorDatabaseConnections: !Not [!Equals [!Ref 'DatabaseConnectionAlarmThreshold', 0]]
  MonitorDatabaseMemory: !Not [!Equals [!Ref 'DatabaseFreeableMemoryAlarmBytes', 0]]
  PublicApi: !Equals [!Ref 'ApiExposure', internet-facing]
  ForwardApi: !Or [!Not [!Condition PublicApi], !Equals [!Ref PublicApiEnabled, 'true']]
  ManagePrivateApiIngress: !And
    - !Condition HasPrivateApi
    - !Equals [!Ref 'ManageApiIngress', 'true']
  HasSesSmtpKmsKey: !And [!Condition UseSmtp, !Not [!Equals [!Ref SesSmtpKmsKeyArn, '']]]
  RunStudio: !Equals
    - !Ref 'EnableStudio'
    - 'true'
  CreateDns: !Not
    - !Equals
      - !Ref 'HostedZoneId'
      - ''
  MultiAZ: !Equals
    - !Ref 'DatabaseMultiAZ'
    - 'true'
  ProtectDatabase: !Equals
    - !Ref 'DatabaseDeletionProtection'
    - 'true'
  HasAlarmTopic: !Not
    - !Equals
      - !Ref 'AlarmTopicArn'
      - ''
Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref 'LogRetentionDays'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: !Ref 'ContainerInsights'
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Condition: UseVpcEncryption
    Properties:
      Name: !Sub '${AWS::StackName}.internal'
      Vpc: !Ref 'VpcId'
  TlsNamespace:
    Type: AWS::ServiceDiscovery::HttpNamespace
    Condition: UseServiceConnectTls
    Properties:
      Name: !Sub '${AWS::StackName}-tls'
  ApiAlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ApiAlb Supabase access
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  GatewaySG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Gateway Supabase access
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  AuthSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Auth Supabase access
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  RestSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Rest Supabase access
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  StorageSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Storage Supabase access
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  AdminSG:
    Type: AWS::EC2::SecurityGroup
    Condition: RunStudio
    Properties:
      GroupDescription: Admin Supabase access
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  AdminAlbSG:
    Type: AWS::EC2::SecurityGroup
    Condition: RunStudio
    Properties:
      GroupDescription: AdminAlb Supabase access
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  BootstrapSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bootstrap Supabase access
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  DatabaseSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database Supabase access
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  PublicHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: PublicApi
    Properties:
      GroupId: !Ref 'ApiAlbSG'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
  PrivateApiHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ManagePrivateApiIngress
    # Rules reject the empty optional ID before this resource is created.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      GroupId: !If [AdditionalPrivateApi, !Ref PrivateApiAlbSG, !Ref ApiAlbSG]
      SourceSecurityGroupId: !Ref 'ApiClientSecurityGroupId'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
  AdminHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: RunStudio
    Properties:
      GroupId: !Ref 'AdminAlbSG'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref 'StudioClientCidr'
  PrivateApiAlbSG:
    Type: AWS::EC2::SecurityGroup
    Condition: AdditionalPrivateApi
    Properties:
      GroupDescription: Private API HTTPS access
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          DestinationSecurityGroupId: !Ref GatewaySG
  PrivateGatewayIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AdditionalPrivateApi
    Properties:
      GroupId: !Ref GatewaySG
      SourceSecurityGroupId: !Ref PrivateApiAlbSG
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
  PublicGatewayIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref 'GatewaySG'
      SourceSecurityGroupId: !Ref 'ApiAlbSG'
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
  PublicGatewayEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref 'ApiAlbSG'
      DestinationSecurityGroupId: !Ref 'GatewaySG'
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
  AdminUiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: RunStudio
    Properties:
      GroupId: !Ref 'AdminSG'
      SourceSecurityGroupId: !Ref 'AdminAlbSG'
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
  AdminUiEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: RunStudio
    Properties:
      GroupId: !Ref 'AdminAlbSG'
      DestinationSecurityGroupId: !Ref 'AdminSG'
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
  AdminGatewayIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: RunStudio
    Properties:
      GroupId: !Ref 'GatewaySG'
      SourceSecurityGroupId: !Ref 'AdminSG'
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
  AdminGatewayEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: RunStudio
    Properties:
      GroupId: !Ref 'AdminSG'
      DestinationSecurityGroupId: !Ref 'GatewaySG'
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
  GatewayAuthIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref 'AuthSG'
      SourceSecurityGroupId: !Ref 'GatewaySG'
      IpProtocol: tcp
      FromPort: 9999
      ToPort: 9999
  GatewayAuthEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref 'GatewaySG'
      DestinationSecurityGroupId: !Ref 'AuthSG'
      IpProtocol: tcp
      FromPort: 9999
      ToPort: 9999
  GatewayRestIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref 'RestSG'
      SourceSecurityGroupId: !Ref 'GatewaySG'
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
  GatewayRestEgress:
