      FromPort: 5432
      ToPort: 5432
  StorageDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref 'StorageSG'
      DestinationSecurityGroupId: !Ref 'DatabaseSG'
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
  AdminDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: RunStudio
    Properties:
      GroupId: !Ref 'DatabaseSG'
      SourceSecurityGroupId: !Ref 'AdminSG'
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
  AdminDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: RunStudio
    Properties:
      GroupId: !Ref 'AdminSG'
      DestinationSecurityGroupId: !Ref 'DatabaseSG'
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
  BootstrapDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref 'DatabaseSG'
      SourceSecurityGroupId: !Ref 'BootstrapSG'
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
  BootstrapDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref 'BootstrapSG'
      DestinationSecurityGroupId: !Ref 'DatabaseSG'
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
  AuthSmtp:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: UseSmtp
    Properties:
      GroupId: !Ref 'AuthSG'
      IpProtocol: tcp
      FromPort: 587
      ToPort: 587
      CidrIp: 0.0.0.0/0
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateDatabaseSecret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username": "postgres"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username": "supabase_auth_admin"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  RestSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username": "authenticator"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  StorageSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username": "supabase_storage_admin"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  ApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: JWT_SECRET
        PasswordLength: 48
        ExcludePunctuation: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  MetaSecret:
    Type: AWS::SecretsManager::Secret
    Condition: RunStudio
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: crypto_key
        PasswordLength: 48
        ExcludePunctuation: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Existing private database subnets
      SubnetIds: !Ref 'DatabaseSubnetIds'
  DbParameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Supabase PostgreSQL 17 TLS policy
      Family: postgres17
      Parameters:
        rds.force_ssl: '1'
        password_encryption: scram-sha-256
        pg_stat_statements.track: !Ref 'DatabaseQueryStatistics'
        pg_stat_statements.track_utility: '0'
  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: !Ref 'DatabaseEngineVersion'
      DBName: postgres
      MasterUsername: postgres
      MasterUserPassword: !Sub
        - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'
        - SecretArn: !If [UseExistingDatabaseSecret, !Ref ExistingDatabaseSecretArn, !Ref DatabaseSecret]
      DBInstanceClass: !Ref 'DatabaseInstanceClass'
      DBSubnetGroupName: !Ref 'DbSubnets'
      DBParameterGroupName: !Ref 'DbParameters'
      VPCSecurityGroups:
        - !Ref 'DatabaseSG'
      AllocatedStorage: !Ref 'DatabaseAllocatedStorage'
      MaxAllocatedStorage: !Ref 'DatabaseMaxAllocatedStorage'
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: !If [MultiAZ, true, false]
      DeletionProtection: !If [ProtectDatabase, true, false]
      BackupRetentionPeriod: !Ref 'DatabaseBackupRetentionDays'
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports:
        - postgresql
        - upgrade
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - !If
            - ExpireStorageHistory
            - Id: ExpireNoncurrentVersions
              Status: Enabled
              Prefix: ''
              NoncurrentVersionExpiration:
                NoncurrentDays: !Ref 'StorageNoncurrentVersionRetentionDays'
            - !Ref 'AWS::NoValue'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref 'Bucket'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt 'Bucket.Arn'
              - !Sub '${Bucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  GatewayExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt 'LogGroup.Arn'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref 'ApiSecret'
  AuthExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt 'LogGroup.Arn'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref 'AuthSecret'
                  - !Ref 'ApiSecret'
                  - !If [HasSesSmtpSecret, !Ref SesSmtpSecretArn, !Ref AWS::NoValue]
                  - !If [HasEmailHookSecret, !Ref EmailHookSecretArn, !Ref AWS::NoValue]
              - !If
                - HasSesSmtpKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref 'SesSmtpKmsKeyArn'
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub
                        - 'secretsmanager.${SecretRegion}.${AWS::URLSuffix}'
                        - SecretRegion: !Select [3, !Split [':', !Ref 'SesSmtpSecretArn']]
                      kms:EncryptionContext:SecretARN: !Ref 'SesSmtpSecretArn'
                - !Ref 'AWS::NoValue'
              - !If
                - HasEmailHookKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref 'EmailHookKmsKeyArn'
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub
                        - 'secretsmanager.${SecretRegion}.${AWS::URLSuffix}'
                        - SecretRegion: !Select [3, !Split [':', !Ref 'EmailHookSecretArn']]
                      kms:EncryptionContext:SecretARN: !Ref 'EmailHookSecretArn'
                - !Ref 'AWS::NoValue'
  RestExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt 'LogGroup.Arn'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref 'RestSecret'
                  - !Ref 'ApiSecret'
  StorageExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt 'LogGroup.Arn'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref 'StorageSecret'
                  - !Ref 'ApiSecret'
  AdminExecutionRole:
    Type: AWS::IAM::Role
    Condition: RunStudio
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt 'LogGroup.Arn'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !If [UseExistingDatabaseSecret, !Ref ExistingDatabaseSecretArn, !Ref DatabaseSecret]
                  - !Ref 'ApiSecret'
                  - !Ref 'MetaSecret'
              - !If
                - HasDatabaseSecretKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref ExistingDatabaseSecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.${AWS::URLSuffix}'
                      kms:EncryptionContext:SecretARN: !Ref ExistingDatabaseSecretArn
                - !Ref AWS::NoValue
  StorageRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource:
                  - !GetAtt 'Bucket.Arn'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource:
                  - !Sub '${Bucket.Arn}/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactsBucket}/${CertificateKey}'
  CertificatesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadCertificate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactsBucket}/${CertificateKey}'
  ServiceConnectRole:
    Type: AWS::IAM::Role
    Condition: UseServiceConnectTls
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSInfrastructureRolePolicyForServiceConnectTransportLayerSecurity'
      Policies: !If
        - HasServiceConnectKmsKey
        - - PolicyName: EncryptTlsSecrets
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:Encrypt
                    - kms:Decrypt
                    - kms:GenerateDataKey
                    - kms:GenerateDataKeyPair
                  Resource: !Ref 'ServiceConnectKmsKeyArn'
        - !Ref 'AWS::NoValue'
  BootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - UseVpcEncryption
                - Effect: Allow
                  Action: ec2:DescribeVpcEncryptionControls
                  Resource: '*'
                - !Ref 'AWS::NoValue'
              - !If
                - ManageServiceLogRetention
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:PutRetentionPolicy
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/${Database}/postgresql:*'
                    - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/${Database}/upgrade:*'
                    - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/containerinsights/${Cluster}/performance:*'
                - !Ref 'AWS::NoValue'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt 'LogGroup.Arn'
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
              - Effect: Deny
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !If [UseExistingDatabaseSecret, !Ref ExistingDatabaseSecretArn, !Ref DatabaseSecret]
                  - !Ref 'AuthSecret'
                  - !Ref 'RestSecret'
                  - !Ref 'StorageSecret'
                  - !Ref 'ApiSecret'
                  - !If [HasLegacyApiKeys, !Ref LegacyApiKeysSecretArn, !Ref AWS::NoValue]
              - Effect: Allow
                Action: secretsmanager:PutSecretValue
                Resource:
                  - !Ref 'AuthSecret'
                  - !Ref 'RestSecret'
                  - !Ref 'StorageSecret'
                  - !Ref 'ApiSecret'
              - !If
                - HasDatabaseSecretKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref ExistingDatabaseSecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.${AWS::URLSuffix}'
                      kms:EncryptionContext:SecretARN: !Ref ExistingDatabaseSecretArn
                - !Ref AWS::NoValue
              - !If
                - HasLegacyApiKeysKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref LegacyApiKeysKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.${AWS::URLSuffix}'
                      kms:EncryptionContext:SecretARN: !Ref LegacyApiKeysSecretArn
                - !Ref AWS::NoValue
  BootstrapHandler:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Architectures: [x86_64]
      Handler: bootstrap.handler
      Role: !GetAtt 'BootstrapRole.Arn'
      Timeout: 900
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      VpcConfig:
        SubnetIds: !Ref 'PrivateSubnetIds'
        SecurityGroupIds:
          - !Ref 'BootstrapSG'
      LoggingConfig:
        LogGroup: !Ref 'LogGroup'
      Code:
        S3Bucket: !Ref 'ArtifactsBucket'
        S3Key: !Ref 'BootstrapKey'
  EncryptionCheck:
    Type: Custom::NetworkPrerequisites
    Properties:
      ServiceToken: !GetAtt 'BootstrapHandler.Arn'
      ServiceTimeout: 960
      Revision: !Ref 'BootstrapKey'
      VpcId: !Ref 'VpcId'
      Mode: !Ref 'InternalTrafficEncryption'
  Bootstrap:
    Type: Custom::DatabaseBootstrap
    Properties:
      CredentialRevision: !Ref 'CredentialRevision'
      ServiceToken: !GetAtt 'BootstrapHandler.Arn'
      ServiceTimeout: 960
      Revision: !Ref 'BootstrapKey'
      DatabaseHost: !GetAtt 'Database.Endpoint.Address'
      DatabasePort: !GetAtt 'Database.Endpoint.Port'
      DatabaseSecret: !If [UseExistingDatabaseSecret, !Ref ExistingDatabaseSecretArn, !Ref DatabaseSecret]
      AuthSecret: !Ref 'AuthSecret'
      RestSecret: !Ref 'RestSecret'
      StorageSecret: !Ref 'StorageSecret'
      ApiSecret: !Ref 'ApiSecret'
      LegacyApiKeysSecret: !If [HasLegacyApiKeys, !Ref LegacyApiKeysSecretArn, !Ref 'AWS::NoValue']
    DependsOn:
      - EncryptionCheck
      - BootstrapDatabaseIngress
      - BootstrapDatabaseEgress
  ServiceLogRetention:
    Type: Custom::ServiceLogRetention
    Condition: ManageServiceLogRetention
    DependsOn: Bootstrap
    Properties:
      ServiceToken: !GetAtt 'BootstrapHandler.Arn'
      ServiceTimeout: 960
      Revision: !Ref 'BootstrapKey'
      RetentionInDays: !Ref 'ServiceLogRetentionDays'
      LogGroups:
        - !Sub '/aws/rds/instance/${Database}/postgresql'
        - !Sub '/aws/rds/instance/${Database}/upgrade'
        - !Sub '/aws/ecs/containerinsights/${Cluster}/performance'
      CreateLogGroups:
        - !Sub '/aws/rds/instance/${Database}/postgresql'
        - !Sub '/aws/rds/instance/${Database}/upgrade'
        - !If
          - CollectContainerInsights
          - !Sub '/aws/ecs/containerinsights/${Cluster}/performance'
          - !Ref 'AWS::NoValue'
  GatewayTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: !If [GatewayTlsCpuFloor, '512', !Ref 'GatewayCpu']
      Memory: !If [GatewayTlsMemoryFloor, '1024', !Ref 'GatewayMemory']
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: !Ref 'EcsCpuArchitecture'
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt 'GatewayExecutionRole.Arn'
      ContainerDefinitions:
        - Name: gateway
          Image: envoyproxy/envoy:v1.39.1@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4
          EntryPoint: [/bin/sh, -ec]
          Command:
            - "@include gateway-entrypoint.sh"
          PortMappings:
            - Name: gateway
              AppProtocol: http
              ContainerPort: 8000
          Environment:
            - Name: SERVICE_NAMESPACE
              Value: !Sub '${AWS::StackName}.internal'
            - Name: ENVOY_BOOTSTRAP
              Value: |
                dynamic_resources:
                  cds_config:
                    path_config_source:
                      path: /etc/envoy/cds.yaml
                    resource_api_version: V3
                  lds_config:
                    path_config_source:
                      path: /etc/envoy/lds.yaml
                    resource_api_version: V3

                node:
                  cluster: supabase_cluster
                  id: supabase_node

                overload_manager:
                  resource_monitors:
                    - name: envoy.resource_monitors.global_downstream_max_connections
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
                        max_active_downstream_connections: 30000

                admin:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9901
            - Name: ENVOY_CLUSTERS
              Value: |
                resources:
                - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
                  name: auth
                  connect_timeout: 5s
                  type: STRICT_DNS
                  dns_lookup_family: V4_PREFERRED
                  dns_refresh_rate: 5s
                  dns_failure_refresh_rate:
                    base_interval: 1s
                    max_interval: 1s
                  lb_policy: ROUND_ROBIN
                  load_assignment:
                    cluster_name: auth
                    endpoints:
                    - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: auth.${SERVICE_NAMESPACE}
                              port_value: 9999
                  health_checks:
                  - timeout: 2s
                    interval: 5s
                    unhealthy_threshold: 3
                    healthy_threshold: 2
                    http_health_check:
                      path: /health
                  circuit_breakers:
                    thresholds:
                    - priority: DEFAULT
                      max_connections: 10000
                      max_pending_requests: 10000
                      max_requests: 10000
                - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
                  name: rest
                  connect_timeout: 5s
                  type: STRICT_DNS
                  dns_lookup_family: V4_PREFERRED
                  dns_refresh_rate: 5s
                  dns_failure_refresh_rate:
                    base_interval: 1s
                    max_interval: 1s
                  lb_policy: ROUND_ROBIN
                  load_assignment:
                    cluster_name: rest
                    endpoints:
                    - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: rest.${SERVICE_NAMESPACE}
                              port_value: 3000
                  health_checks:
                  - timeout: 2s
                    interval: 5s
                    unhealthy_threshold: 3
                    healthy_threshold: 2
                    http_health_check:
                      path: /
                  circuit_breakers:
                    thresholds:
                    - priority: DEFAULT
                      max_connections: 10000
                      max_pending_requests: 10000
                      max_requests: 10000
